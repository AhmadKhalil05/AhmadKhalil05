name: Update profile

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'profile-config.json'
      - 'source/**'
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch contributions & regenerate assets
        run: |
          python scripts/fetch_contributions.py
          python scripts/generate_contributions.py
          python scripts/generate_profile.py

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contributions.svg assets/profile-hero.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update profile assets [skip ci]"
            git push
          fi
