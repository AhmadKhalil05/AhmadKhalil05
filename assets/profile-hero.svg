      <animate attributeName="opacity" from="0" to="1" dur="0.30s" begin="0.71s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.30s" begin="0.71s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(0, 4)">
      <text x="505" y="264" class="meta-label">Based    </text>
      <text x="600" y="264" class="meta-val" fill="#e6edf3">Palestine</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.30s" begin="0.83s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.30s" begin="0.83s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(0, 4)">
