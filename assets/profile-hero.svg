<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .term-prompt { fill: #7ee787; font-weight: 600; font-size: 14px; }
    .term-path { fill: #8b949e; font-size: 14px; }
    .term-cmd { fill: #f0f6fc; font-weight: 600; font-size: 14px; }
    .term-dim { fill: #8b949e; font-size: 12px; }
    .name-title { fill: #f0f6fc; font-size: 32px; font-weight: 700; }
    .role-title { fill: #7ee787; font-size: 17px; font-weight: 600; }
    .bio-text { fill: #c9d1d9; font-size: 14px; line-height: 24px; }
    .meta-label { fill: #8b949e; font-size: 14px; font-weight: 600; }
    .meta-val { fill: #e6edf3; font-size: 14px; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4; }
    .tag-text { fill: #7ee787; font-size: 12px; font-weight: 500; }
  </style>
  <rect x="1" y="1" width="1198" height="378" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <!-- Terminal Header -->
  <g class="mono">
    <circle cx="28" cy="27" r="4.5" fill="#ff5f56" opacity="0.8"/>
    <circle cx="44" cy="27" r="4.5" fill="#ffbd2e" opacity="0.8"/>
    <circle cx="60" cy="27" r="4.5" fill="#27c93f" opacity="0.8"/>
    <text x="88" y="32" class="term-prompt">ahmad@github</text>
    <text x="195" y="32" class="term-path"> ~ $ </text>
    <text x="236" y="32" class="term-cmd">whoami --verbose</text>
    <rect x="375" y="20" width="8" height="15" fill="#7ee787" rx="1">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="1172" y="32" text-anchor="end" class="term-dim">profile://AhmadKhalil05</text>
  </g>
  <line x1="1" y1="52" x2="1199" y2="52" stroke="#21262d" stroke-width="1"/>
  <!-- Identity Section -->
  <g class="mono">
    <text x="55" y="112" class="name-title">Ahmad Khalil</text>
    <text x="55" y="142" class="role-title">Designer &amp; Software Engineer</text>
    <line x1="55" y1="168" x2="420" y2="168" stroke="#21262d" stroke-width="1"/>
    <text x="55" y="202" class="bio-text">Crafting scalable cloud architectures,</text>
    <text x="55" y="226" class="bio-text">automated testing pipelines, and</text>
    <text x="55" y="250" class="bio-text">high-performance web interfaces.</text>
    <rect x="55" y="280" width="100.0" height="24" rx="4" class="tag-box"/>
    <text x="105.0" y="296" text-anchor="middle" class="tag-text">TypeScript</text>
    <rect x="165.0" y="280" width="59.0" height="24" rx="4" class="tag-box"/>
    <text x="194.5" y="296" text-anchor="middle" class="tag-text">React</text>
    <rect x="234.0" y="280" width="42.599999999999994" height="24" rx="4" class="tag-box"/>
    <text x="255.3" y="296" text-anchor="middle" class="tag-text">AWS</text>
    <rect x="286.6" y="280" width="100.0" height="24" rx="4" class="tag-box"/>
    <text x="336.6" y="296" text-anchor="middle" class="tag-text">Playwright</text>
    <rect x="396.6" y="280" width="75.39999999999999" height="24" rx="4" class="tag-box"/>
    <text x="434.3" y="296" text-anchor="middle" class="tag-text">Next.js</text>
  </g>
  <!-- Center Divider -->
  <line x1="460" y1="75" x2="460" y2="350" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- System & Technical Specs -->
  <g class="mono">
    <g transform="translate(0, 0)">
      <text x="500" y="112" class="meta-label">Role     </text>
      <text x="595" y="112" class="meta-val" fill="#e6edf3">Designer &amp; Software Engineer</text>
    </g>
    <g transform="translate(0, 0)">
      <text x="500" y="150" class="meta-label">Focus    </text>
      <text x="595" y="150" class="meta-val" fill="#e6edf3">Full-Stack · Cloud · QA</text>
    </g>
    <g transform="translate(0, 0)">
      <text x="500" y="188" class="meta-label">Stack    </text>
      <text x="595" y="188" class="meta-val" fill="#e6edf3">TypeScript · React · AWS</text>
    </g>
    <g transform="translate(0, 0)">
      <text x="500" y="226" class="meta-label">Builds   </text>
      <text x="595" y="226" class="meta-val" fill="#e6edf3">Serverless · E2E · 3D Web</text>
    </g>
    <g transform="translate(0, 0)">
      <text x="500" y="264" class="meta-label">Based    </text>
      <text x="595" y="264" class="meta-val" fill="#e6edf3">Palestine</text>
    </g>
    <g transform="translate(0, 0)">
      <text x="500" y="302" class="meta-label">Website  </text>
      <text x="595" y="302" class="meta-val" fill="#7ee787">ahmadkh.framer.ai</text>
    </g>
    <line x1="500" y1="334" x2="1160" y2="334" stroke="#21262d" stroke-width="1"/>
    <text x="500" y="354" font-size="12" fill="#8b949e">uptime: active · license: MIT · shell: zsh</text>
  </g>
</svg>