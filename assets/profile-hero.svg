      <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.30s" begin="0.47s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(0, 4)">
      <text x="505" y="188" class="meta-label">Stack    </text>
