<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390">
  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .term-prompt { fill: #7ee787; font-weight: 600; font-size: 14px; }
    .term-path { fill: #8b949e; font-size: 14px; }
    .term-cmd { fill: #f0f6fc; font-weight: 600; font-size: 14px; }
    .term-dim { fill: #8b949e; font-size: 12px; }
    .name-title { fill: #f0f6fc; font-size: 32px; font-weight: 700; }
    .role-title { fill: #7ee787; font-size: 17px; font-weight: 600; }
    .bio-text { fill: #c9d1d9; font-size: 14px; }
    .meta-label { fill: #8b949e; font-size: 14px; font-weight: 600; }
    .meta-val { fill: #e6edf3; font-size: 14px; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .tag-text { fill: #7ee787; font-size: 12px; font-weight: 500; }
    .sub-note { fill: #8b949e; font-size: 12px; }
  </style>
  <rect x="1" y="1" width="1198" height="388" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <!-- Terminal Header -->
  <g class="mono">
    <circle cx="28" cy="27" r="4.5" fill="#ff5f56" opacity="0.8"/>
    <circle cx="44" cy="27" r="4.5" fill="#ffbd2e" opacity="0.8"/>
    <circle cx="60" cy="27" r="4.5" fill="#27c93f" opacity="0.8"/>
    <text x="88" y="32" class="term-prompt">ahmad@github</text>
    <text x="195" y="32" class="term-path"> ~ $ </text>
    <text x="236" y="32" class="term-cmd">whoami --verbose</text>
    <rect x="375" y="20" width="8" height="15" fill="#7ee787" rx="1">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="1172" y="32" text-anchor="end" class="term-dim">profile://AhmadKhalil05</text>
  </g>
  <line x1="1" y1="52" x2="1199" y2="52" stroke="#21262d" stroke-width="1"/>
