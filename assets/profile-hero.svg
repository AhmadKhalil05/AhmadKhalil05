      <animate attributeName="opacity" from="0" to="1" dur="0.30s" begin="1.05s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.30s" begin="1.05s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(0, 4)">
