      <text x="273.0" y="330" text-anchor="middle" class="tag-text">Playwright</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.30s" begin="1.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.30s" begin="1.35s" fill="freeze"/>
